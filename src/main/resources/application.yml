spring:
  application:
    name: job-discovery-platform

  datasource:
    # All connection values are supplied via environment variables (see
    # .env.example). The defaults below target a Postgres running on the host's
    # localhost, which is convenient if you ever run the app outside Docker.
    # Under Docker Compose these are overridden to point at the "db" service.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobdiscovery}
    username: ${SPRING_DATASOURCE_USERNAME:jobdiscovery}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      pool-name: job-discovery-pool
      maximum-pool-size: 5

  jpa:
    hibernate:
      # No Hibernate auto-DDL. Flyway owns the schema (src/main/resources/db/
      # migration). "none" means Hibernate neither creates nor validates tables —
      # the versioned migrations are the single source of truth.
      ddl-auto: none
    # Disable open-session-in-view: keep transaction boundaries in the service
    # layer rather than leaking a Hibernate session into the web layer.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only expose what we actually use. "health" drives the container
        # healthcheck and lets us confirm DB connectivity on boot.
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

# --- External job sources ---------------------------------------------------
adzuna:
  base-url: https://api.adzuna.com/v1/api
  # Read from environment variables (see .env). Blank by default so the app
  # still boots without them; the fetch endpoints then return a clear error.
  app-id: ${ADZUNA_APP_ID:}
  app-key: ${ADZUNA_APP_KEY:}
  # ISO country code for the Adzuna market to search (India).
  country: in
  results-per-page: 20
  # Data freshness: only fetch postings from the last N days. Overridable at
  # runtime via ADZUNA_MAX_DAYS_OLD (set to 0 to disable the filter).
  max-days-old: ${ADZUNA_MAX_DAYS_OLD:30}
  # Result ordering: date (newest first) | relevance | salary | hybrid.
  sort-by: ${ADZUNA_SORT_BY:date}

jooble:
  base-url: https://jooble.org/api
  # Key is part of the request URL path (see .env). Blank by default so the app
  # boots without it; the Jooble fetch then returns a clear error until it's set.
  api-key: ${JOOBLE_API_KEY:}
  # Jooble's location matching is coarse in some markets — Indian city names
  # return nothing, but the country does. If a specific location yields no
  # results, retry with this broader fallback. Override via JOOBLE_FALLBACK_LOCATION.
  fallback-location: ${JOOBLE_FALLBACK_LOCATION:India}

arbeitnow:
  # DISABLED by default. Arbeitnow's open API is Germany/EU-centric and supports
  # NO keyword/location filtering (verified: search/q/keyword/tag/location/remote
  # are all ignored). Not useful for a Java/India search. Set ARBEITNOW_ENABLED=true
  # to re-activate the source (e.g. for a European job search).
  enabled: ${ARBEITNOW_ENABLED:false}
  base-url: https://www.arbeitnow.com/api

# --- Scheduled daily fetch (Phase 3) ---------------------------------------
fetch:
  schedule:
    # Automated daily fetch. Disable with FETCH_SCHEDULE_ENABLED=false.
    enabled: ${FETCH_SCHEDULE_ENABLED:true}
    # Spring cron: second minute hour day-of-month month day-of-week.
    # Default: 06:00 every day, in the zone below.
    cron: ${FETCH_SCHEDULE_CRON:0 0 6 * * *}
    zone: ${FETCH_SCHEDULE_ZONE:Asia/Kolkata}
    # What the scheduled run searches for.
    keywords: ${FETCH_KEYWORDS:java developer}
    location: ${FETCH_LOCATION:bangalore}

# --- Scoring rule engine (Phase 5) -----------------------------------------
# Relative weights for the deterministic rule engine. The score divides earned
# points by the weight of the dimensions that ACTUALLY APPLIED, so a profile
# that leaves (say) preferredCompanies empty is not marked down for it — that
# dimension simply drops out. Expressed out of 100 for readability.
#
# No LLM is involved in producing the number: Phase 5's LLM layer only explains
# the score these weights produce.
scoring:
  # The country this search targets. A posting whose location is *only* this
  # country (Jooble reports "India" for every result, since it cannot geocode
  # Indian cities) is scored as location-unknown rather than location-wrong.
  home-country: ${SCORING_HOME_COUNTRY:India}
  # Both sources return a preview, not the posting: Adzuna caps the description
  # at 500 characters ("…") and Jooble's field is a "snippet" ("...&nbsp;"). All
  # 57 stored rows are truncated. So a skill the text never mentions is usually
  # evidence the text ran out, not evidence the job does not want it — this is
  # how much an unmatched skill still counts against a job in that case.
  # 1.0 restores the old behaviour (treat a preview like full text); 0.0 ignores
  # unmatched skills entirely. Full descriptions are never discounted.
  truncated-miss-weight: ${SCORING_TRUNCATED_MISS_WEIGHT:0.5}
  weights:
    # Skill overlap between the profile and the posting text.
    skills: ${SCORING_WEIGHT_SKILLS:35}
    # How well the posting's level fits the candidate's years. Weighted heavily
    # because a "java developer" search returns a wide spread of seniorities and
    # a 10-year candidate should not be shown 2-5 year roles.
    seniority: ${SCORING_WEIGHT_SENIORITY:25}
    # Posting location against the profile's preferred locations.
    location: ${SCORING_WEIGHT_LOCATION:20}
    # Profile keywords beyond the hard skills list.
    keywords: ${SCORING_WEIGHT_KEYWORDS:10}
    # Bonus when the employer is one the candidate named.
    preferred-company: ${SCORING_WEIGHT_PREFERRED_COMPANY:5}
    # Freshness of the posting (skipped when the source reports no date).
    recency: ${SCORING_WEIGHT_RECENCY:5}

# --- Phase 5b: match explanations -------------------------------------------
# The rule engine above produces the score. This layer only puts that score into
# words — it is never shown the raw posting and can never change the number.
# Three tiers, in order: the chosen provider, then the templated explainer, then
# an error.
explanation:
  # none | ollama | claude.
  #   none   - no model; the templated explainer answers. Works out of the box.
  #   ollama - free, local, no key. Needs: docker compose --profile llm up -d ollama
  #   claude - Anthropic API. Billed per token from a prepaid balance; a Claude
  #            Pro subscription does NOT fund it.
  provider: ${EXPLANATION_PROVIDER:none}
  # templated | error. What happens when the provider cannot answer — a stopped
  # Ollama container, a model not yet pulled, an exhausted API balance. Default
  # degrades to plainer prose; "error" surfaces the outage instead.
  fallback: ${EXPLANATION_FALLBACK:templated}
  # How many ranked results get an explanation. Only a cost control for a paid
  # provider — the template and a local model are free.
  max-matches: ${EXPLANATION_MAX_MATCHES:5}

  ollama:
    # Service name on the compose network, so no published port is needed.
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    # Small on purpose. The rule engine already did the judging; this only
    # writes it up, so a 3B instruct model is enough and fits the memory budget.
    model: ${OLLAMA_MODEL:llama3.2:3b}
    # Low temperature keeps it close to the evidence instead of embellishing.
    temperature: ${OLLAMA_TEMPERATURE:0.3}
    num-predict: ${OLLAMA_NUM_PREDICT:300}

  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${EXPLANATION_CLAUDE_MODEL:claude-opus-5}
    # Thinking tokens count towards this as well as the visible answer.
    max-tokens: ${EXPLANATION_CLAUDE_MAX_TOKENS:2048}
    effort: ${EXPLANATION_CLAUDE_EFFORT:low}
