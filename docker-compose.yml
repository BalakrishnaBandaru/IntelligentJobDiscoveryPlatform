# Phase 0 stack: PostgreSQL + Adminer (DB viewer) + the Spring Boot app,
# all containerised. Brought forward from the original plan's Phase 8 so the
# whole thing runs with `docker compose up --build` and no host installs.
#
# Variable values come from the .env file (copy it from .env.example first).

services:
  db:
    image: postgres:18
    container_name: jobdiscovery-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Store data in a sub-directory of the mount. This is the recommended
      # pattern and keeps us independent of any per-version change to the
      # image's default data directory.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bound to the loopback address, not 0.0.0.0. A host tool (DBeaver, psql)
      # still reaches it at localhost:5432, but other machines on the network
      # cannot — which matters because the credentials are in .env.example, and
      # this repo is public.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: jobdiscovery-adminer
    ports:
      # Loopback only, for the same reason as the db port above — Adminer is a
      # full database client, so exposing it to the network hands out whatever
      # the published credentials unlock. It talks to "db" over the compose
      # network, so this binding only affects browser access from this machine.
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobdiscovery-app
    environment:
      # Point Spring at the "db" service. Credentials are derived from the same
      # POSTGRES_* values above so there is a single source of truth.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Adzuna API credentials (Phase 1) — sourced from .env, empty if unset.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      # Optional tuning (defaults live in application.yml): recency window + sort.
      # Change these in .env and recreate the app container — no rebuild needed.
      ADZUNA_MAX_DAYS_OLD: ${ADZUNA_MAX_DAYS_OLD:-30}
      ADZUNA_SORT_BY: ${ADZUNA_SORT_BY:-date}
      # Jooble (Phase 2) — key is part of the request URL path.
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      # Jooble location fallback (Indian cities return nothing from Jooble; the
      # country does). Override in .env if desired.
      JOOBLE_FALLBACK_LOCATION: ${JOOBLE_FALLBACK_LOCATION:-India}
      # Arbeitnow is integrated but disabled by default (Germany/EU feed, no
      # keyword/location filtering). Set true to re-activate.
      ARBEITNOW_ENABLED: ${ARBEITNOW_ENABLED:-false}
      # Scheduler (Phase 3) — daily automated fetch. Tune via .env.
      FETCH_SCHEDULE_ENABLED: "${FETCH_SCHEDULE_ENABLED:-true}"
      FETCH_SCHEDULE_CRON: "${FETCH_SCHEDULE_CRON:-0 0 6 * * *}"
      FETCH_SCHEDULE_ZONE: "${FETCH_SCHEDULE_ZONE:-Asia/Kolkata}"
      FETCH_KEYWORDS: "${FETCH_KEYWORDS:-java developer}"
      FETCH_LOCATION: "${FETCH_LOCATION:-bangalore}"
      # Scoring weights (Phase 5a). application.yml reads all of these from the
      # environment, but without these passthroughs they never reached the
      # container — so the weights were only tunable by editing YAML and
      # rebuilding, which is precisely the friction the env vars existed to
      # avoid. Change one in .env and `docker compose up -d --force-recreate app`.
      SCORING_WEIGHT_SKILLS: ${SCORING_WEIGHT_SKILLS:-35}
      SCORING_WEIGHT_SENIORITY: ${SCORING_WEIGHT_SENIORITY:-25}
      SCORING_WEIGHT_LOCATION: ${SCORING_WEIGHT_LOCATION:-20}
      SCORING_WEIGHT_KEYWORDS: ${SCORING_WEIGHT_KEYWORDS:-10}
      SCORING_WEIGHT_PREFERRED_COMPANY: ${SCORING_WEIGHT_PREFERRED_COMPANY:-5}
      SCORING_WEIGHT_RECENCY: ${SCORING_WEIGHT_RECENCY:-5}
      SCORING_HOME_COUNTRY: ${SCORING_HOME_COUNTRY:-India}
      SCORING_TRUNCATED_MISS_WEIGHT: ${SCORING_TRUNCATED_MISS_WEIGHT:-0.5}
      # Phase 5b — match explanations. "none" falls through to the templated
      # explainer, so &explain=true works out of the box with no model and no
      # key; set "ollama" (free, local) or "claude" (paid API) to use a model.
      EXPLANATION_PROVIDER: ${EXPLANATION_PROVIDER:-none}
      EXPLANATION_FALLBACK: ${EXPLANATION_FALLBACK:-templated}
      EXPLANATION_MAX_MATCHES: ${EXPLANATION_MAX_MATCHES:-5}
      # Reached over the compose network, so the port need not be published.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXPLANATION_CLAUDE_MODEL: ${EXPLANATION_CLAUDE_MODEL:-claude-opus-5}
      EXPLANATION_CLAUDE_EFFORT: ${EXPLANATION_CLAUDE_EFFORT:-low}
      # Phase 6 — Telegram digest. Off unless the flag and both credentials
      # are set, so the stack still comes up with none of them.
      TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MIN_SCORE: ${TELEGRAM_MIN_SCORE:-60}
      TELEGRAM_MAX_JOBS: ${TELEGRAM_MAX_JOBS:-8}
      TELEGRAM_SEND_ON_STARTUP: "${TELEGRAM_SEND_ON_STARTUP:-true}"
    ports:
      - "8080:8080"
    depends_on:
      # Don't start the app until Postgres reports healthy.
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # One-off test runner. Uses the Dockerfile's BUILD stage (which has the JDK,
  # Gradle and the sources) rather than the runtime stage, which is a JRE with
  # only app.jar in it. Behind a profile so it never starts with `up`.
  #
  #   docker compose --profile test run --rm test
  #
  # It joins the compose network and waits for a healthy db, because the
  # @SpringBootTest context-load test needs a real database to start against.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["./gradlew", "--no-daemon", "test"]

  # Local LLM for match explanations (Phase 5b). Behind the "llm" profile so a
  # plain `docker compose up` stays light — the image is large and the model is
  # a separate download. When it is not running the app degrades to the
  # templated explainer rather than failing, which is the whole point of having
  # that tier.
  #
  #   docker compose --profile llm up -d ollama
  #   docker exec jobdiscovery-ollama ollama pull llama3.2:3b
  #
  # The 3b model is chosen for memory, not quality: this Docker VM has ~7.6 GB
  # and the rule engine has already done the judgement, so the model only has to
  # write two sentences from evidence it is handed.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: jobdiscovery-ollama
    ports:
      # Loopback only — same reasoning as db and adminer above.
      - "127.0.0.1:11434:11434"
    volumes:
      # Persist pulled models so they survive a container recreate.
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
